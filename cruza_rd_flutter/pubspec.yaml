name: cruza_rd
description: "Cruza RD — Endless Crosser Dominicano AAA (Flutter + Flame). Multiplataforma."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Flame engine
  flame: ^1.30.1
  flame_audio: ^2.11.8

  # State + DI + routing
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^15.1.2

  # Persistencia cifrada
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  crypto: ^3.0.6
  shared_preferences: ^2.5.3

  # Config por entorno
  flutter_dotenv: ^5.2.1

  # Networking (anti-cheat API ready; stub local si no hay backend)
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # UI / responsive / motion
  flutter_animate: ^4.5.2
  flutter_svg: ^2.1.0
  google_fonts: ^6.2.1
  responsive_framework: ^1.5.1

  # Desktop window
  window_manager: ^0.4.3

  # Utils
  logger: ^2.5.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/ui/
    - assets/images/characters/
    - assets/images/obstacles/
    - assets/images/collectibles/
    - assets/images/biomes/
    - assets/images/particles/
    - assets/images/powerups/
    - assets/audio/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/fonts/
    - assets/animations/
    - assets/config/
    - .env.dev
    - .env.staging
    - .env.prod

name: Cruza RD CI

on:
  push:
    paths:
      - "cruza_rd_flutter/**"
  pull_request:
    paths:
      - "cruza_rd_flutter/**"

defaults:
  run:
    working-directory: cruza_rd_flutter

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release -t lib/main_dev.dart
